# Puerto dinámico asignado por Render (usa 8080 en local)
server.port=${PORT:8080}

# Configuración de base de datos mediante variables de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/talento_tech?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect